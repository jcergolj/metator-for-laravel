name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: php tests/test-remote-staging.php
      - run: php tests/test-registration-confirmation.php
      - run: php tests/test-deployer-workflow.php
      - run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: find tests stubs/scripts -name '*.sh' -print0 | xargs -0 -n1 shellcheck -x
      - run: for test in tests/*.sh; do bash "$test"; done
